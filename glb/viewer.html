<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLB Viewer AR · Hugo Duarte Tockaes</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101724;color:#f5f7ff;font:15px system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}#scene{position:fixed;inset:0;background:#182238 center/cover no-repeat}#overlay{position:fixed;inset:0;pointer-events:none;z-index:10}#overlay>*{pointer-events:auto}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.brand{background:#101724e8;border:1px solid #506078;border-radius:12px;padding:9px 13px;font-weight:700}.panel{background:#101724e8;border:1px solid #506078;border-radius:12px;padding:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.panel button,.panel label,.card button{border:1px solid #5c6b80;background:#263750;border-radius:8px;padding:8px 11px}.panel .primary{background:#d39123;color:#17202c;border-color:#f3bb57;font-weight:700}.panel input[type=file]{display:none}.panel input[type=color]{width:37px;height:37px;padding:2px;border:1px solid #5c6b80;border-radius:8px;background:#263750}.panel button:disabled{opacity:.5;cursor:not-allowed}.url-form{display:flex;gap:6px;flex:1 1 320px}.url-form[hidden],.loading[hidden]{display:none}.url-form input{min-width:160px;flex:1;padding:8px 10px;color:#fff;background:#111b2b;border:1px solid #708198;border-radius:8px}.status{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#101724e8;border:1px solid #506078;border-radius:10px;padding:9px 12px;text-align:center;font-size:13px}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100vw - 32px));background:#111b2bed;border:1px solid #8493ab;border-radius:14px;padding:18px;box-shadow:0 10px 32px #000a}.loading strong{display:block;margin-bottom:12px}.bar{height:11px;background:#304057;border-radius:10px;overflow:hidden}.bar span{display:block;width:0;height:100%;background:#ffbc4a;border-radius:10px;transition:width .15s}.bar.indeterminate span{width:35%;animation:slide 1.2s ease-in-out infinite}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}.loading small{display:block;margin-top:8px;color:#cbd5e5}.pin{position:absolute;transform:translate(-50%,-50%);width:23px;height:23px;border:2px solid white;border-radius:50%;background:#ffbb36;box-shadow:0 0 0 4px #ffbb3666,0 2px 12px #000a;padding:0;touch-action:manipulation}.pin:focus-visible{outline:3px solid #fff}.card{position:absolute;max-width:min(340px,calc(100vw - 24px));width:280px;max-height:45vh;overflow:auto;background:#192437f5;border:1px solid #75839a;border-radius:12px;padding:16px;box-shadow:0 9px 26px #000a}.card[hidden],.pin[hidden]{display:none}.card h2{font-size:17px;margin:0 28px 9px 0}.card p{white-space:pre-wrap;line-height:1.45;margin:0 0 10px}.card a{color:#ffd48b;overflow-wrap:anywhere}.card .close{position:absolute;right:8px;top:7px;padding:3px 9px;font-size:20px;background:transparent;border:0}.return-menu{display:none;position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;background:#101724c9;border:1px solid #8290a4;border-radius:9px;padding:7px 10px;font-size:12px}body.fullscreen-ui .top,body.fullscreen-ui .status{display:none}body.fullscreen-ui .return-menu{display:block}#overlay: xr-overlay{background:transparent}@media(max-width:650px){.brand{display:none}.panel{width:100%;justify-content:center}.panel button,.panel label{padding:8px}.status{font-size:12px}}
  .top{z-index:4}.status{z-index:4}.return-menu{z-index:5}.loading{z-index:6}#connector{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;visibility:hidden;overflow:visible;filter:drop-shadow(0 1px 3px #000)}#pins{position:absolute;inset:0;pointer-events:none;z-index:2}#pins .pin{pointer-events:auto}.card{z-index:3;cursor:pointer}.card:hover{border-color:#ffbc4a}
</style>
</head>
<body>
<a-scene id="scene" embedded renderer="colorManagement: true; antialias: true; alpha: true" xr-mode-ui="enabled: false" webxr="referenceSpaceType: local; optionalFeatures: hit-test,dom-overlay; overlayElement: #overlay" ar-hit-test="target: #placement; enabled: false" background="transparent: true">
  <a-entity id="camera" camera="fov: 55" look-controls="enabled: false" position="0 1.6 1"></a-entity>
  <a-entity light="type: ambient; intensity: 1.4"></a-entity><a-entity light="type: directional; intensity: 1.1" position="1 3 2"></a-entity>
  <a-entity id="placement" position="0 1.35 -0.8"><a-entity id="fit"><a-entity id="model"></a-entity><a-entity id="points"></a-entity></a-entity></a-entity>
</a-scene>
<div id="overlay">
  <div class="top"><div class="brand">GLB Viewer · AR</div><div class="panel">
    <label for="file">Abrir GLB</label><input id="file" type="file" accept=".glb,model/gltf-binary"><button id="url-toggle" type="button">Abrir URL</button>
    <button id="ar" class="primary" disabled>Entrar em AR</button><button id="replace" hidden>Reposicionar</button>
    <button id="smaller" title="Diminuir">−</button><button id="larger" title="Aumentar">+</button><button id="center">Centralizar</button><button id="toggle-pins" type="button">Ocultar informações</button><button id="fullscreen" type="button">Tela cheia</button>
    <label for="bg-color">Fundo <input id="bg-color" type="color" value="#182238" title="Cor do fundo"></label><label for="bg-file">Imagem de fundo</label><input id="bg-file" type="file" accept="image/*"><button id="clear-bg" type="button">Limpar fundo</button><button id="export-jpg" type="button">Exportar JPG</button>
    <form id="url-form" class="url-form" hidden><input id="url-input" type="url" placeholder="https://exemplo.com/modelo.glb" aria-label="Endereço do GLB" required><button type="submit">Carregar</button></form>
  </div></div>
  <svg id="connector" aria-hidden="true"><line id="connector-line" stroke="#ffbc4a" stroke-width="2" stroke-linecap="round"/><circle id="connector-end" r="3" fill="#ffbc4a"/></svg>
  <div id="pins"></div><div id="card" class="card" hidden title="Clique para fechar"><h2 id="title"></h2><p id="description"></p><a id="link" target="_blank" rel="noopener noreferrer" hidden></a></div>
  <div id="status" class="status" role="status">Abra um arquivo GLB criado no GLB Creator.</div>
  <button id="return-menu" class="return-menu" type="button">Voltar ao menu</button>
  <div id="loading" class="loading" role="status" aria-live="polite" hidden><strong id="loading-title">Carregando modelo…</strong><div id="bar" class="bar"><span id="bar-fill"></span></div><small id="loading-detail">Preparando arquivo</small></div>
</div>
<script>
(()=>{'use strict';
  const $=s=>document.querySelector(s),scene=$('#scene'),placement=$('#placement'),fit=$('#fit'),model=$('#model'),points=$('#points'),camera=$('#camera'),pins=$('#pins'),card=$('#card'),status=$('#status');
  let fileUrl=null,modelReady=false,placed=false,scaleFactor=1,active=null,markers=[],arSupported=false,drag=null,fittedFactor=1,modelCenter=new THREE.Vector3(),viewAnimation=0,arBaseRotation=new THREE.Euler(),loadNumber=0,bgColor='#182238',bgImage=null,bgUrl=null,pinsVisible=true;
  const say=message=>status.textContent=message;
  function progress(percent,label,indeterminate=false){const loading=$('#loading');loading.hidden=false;$('#loading-title').textContent=label;$('#loading-detail').textContent=indeterminate?'Aguarde…':`${Math.round(percent)}%`;$('#bar').classList.toggle('indeterminate',indeterminate);$('#bar-fill').style.width=indeterminate?'35%':Math.max(0,Math.min(100,percent))+'%';}
  function loadingError(message){$('#loading').hidden=true;say(message)}
  function readHotspots(buffer){
    const view=new DataView(buffer);if(view.byteLength<20||view.getUint32(0,true)!==0x46546c67)throw Error('O arquivo não é um GLB válido.');
    const length=view.getUint32(12,true),type=view.getUint32(16,true);if(type!==0x4e4f534a||length<2||20+length>view.byteLength)throw Error('Dados GLB incompletos.');
    const json=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,20,length)));
    const result=[];for(const node of json.nodes||[]){const data=node.extras?.hotspot;if(!data)continue;
      const saved=data.camera,bookmark=saved&&[saved.yaw,saved.pitch,saved.distance].every(Number.isFinite)&&saved.distance>0?{yaw:saved.yaw,pitch:saved.pitch,distance:saved.distance}:null;
      result.push({title:String(data.title||node.name||'Hotspot'),text:String(data.text||''),link:String(data.link||''),position:Array.isArray(node.translation)?node.translation:[0,0,0],camera:bookmark,size:Number.isFinite(data.size)?Math.max(10,Math.min(32,data.size)):18});
    }return result;
  }
  function closeCard(){active=null;card.hidden=true;$('#connector').style.visibility='hidden'}
  function clear(){markers.forEach(item=>item.button.remove());markers=[];points.replaceChildren();model.removeAttribute('gltf-model');modelReady=false;placed=false;closeCard();$('#ar').disabled=true;}
  function buildMarkers(data){for(const item of data){const anchor=document.createElement('a-entity');anchor.setAttribute('position',item.position.map(v=>Number(v)||0).join(' '));points.append(anchor);
      const button=document.createElement('button');button.className='pin';button.type='button';button.hidden=true;button.title=item.title;button.setAttribute('aria-label',item.title);button.style.width=button.style.height=item.size+'px';
      button.addEventListener('pointerdown',e=>e.stopPropagation());button.addEventListener('click',e=>{e.stopPropagation();active=marker;$('#title').textContent=item.title;$('#description').textContent=item.text||'Sem descrição.';const link=$('#link');let url=null;try{url=new URL(item.link,location.href)}catch{}const safe=url&&['https:','http:'].includes(url.protocol);link.hidden=!safe;if(safe){link.href=url.href;link.textContent='Abrir link ↗'}card.hidden=false;positionCard(marker.x,marker.y);applyBookmark(item.camera)});
      pins.append(button);const marker={anchor,button,data:item,x:0,y:0};markers.push(marker);
    }}
  function modelScreenRect(renderCamera){const object=model.getObject3D('mesh');if(!object)return null;
    scene.object3D.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(object);if(box.isEmpty())return null;
    let left=Infinity,right=-Infinity,top=Infinity,bottom=-Infinity;const corner=new THREE.Vector3();
    for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){corner.set(x,y,z).project(renderCamera);if(corner.z < -1 || corner.z > 1)continue;const px=(corner.x*.5+.5)*innerWidth,py=(-corner.y*.5+.5)*innerHeight;left=Math.min(left,px);right=Math.max(right,px);top=Math.min(top,py);bottom=Math.max(bottom,py)}
    return Number.isFinite(left)?{left,right,top,bottom}:null;
  }
  function positionCard(x,y,modelRect){const width=card.offsetWidth||280,height=card.offsetHeight||140,gap=24,pad=12;
    const box=modelRect||{left:x-12,right:x+12,top:y-12,bottom:y+12};
    const candidates=[
      [box.right+gap,y-height/2],[box.left-width-gap,y-height/2],
      [x-width/2,box.bottom+gap],[x-width/2,box.top-height-gap],
      [x+gap,y-height/2],[x-width-gap,y-height/2]
    ];
    const score=([l,t])=>{const r=l+width,b=t+height,overflow=Math.max(0,pad-l)+Math.max(0,r-(innerWidth-pad))+Math.max(0,Math.max(pad,65)-t)+Math.max(0,b-(innerHeight-54));
      const overlap=Math.max(0,Math.min(r,box.right)-Math.max(l,box.left))*Math.max(0,Math.min(b,box.bottom)-Math.max(t,box.top));
      return overflow*10000+overlap*100+Math.hypot(Math.max(0,l-x,x-r),Math.max(0,t-y,y-b));};
    candidates.sort((a,b)=>score(a)-score(b));const [left,top]=candidates[0],clampedLeft=Math.max(pad,Math.min(innerWidth-width-pad,left)),clampedTop=Math.max(pad,Math.min(innerHeight-height-pad,top));card.style.left=clampedLeft+'px';card.style.top=clampedTop+'px';
    if(active&&pinsVisible){const endX=Math.max(clampedLeft,Math.min(x,clampedLeft+width)),endY=Math.max(clampedTop,Math.min(y,clampedTop+height)),dx=endX-x,dy=endY-y,length=Math.hypot(dx,dy)||1,radius=active.data.size/2+3;
      const line=$('#connector-line');line.setAttribute('x1',x+dx/length*radius);line.setAttribute('y1',y+dy/length*radius);line.setAttribute('x2',endX);line.setAttribute('y2',endY);$('#connector-end').setAttribute('cx',endX);$('#connector-end').setAttribute('cy',endY);$('#connector').style.visibility='visible'}
  }
  function fitModel(){const object=model.getObject3D('mesh');if(!object)return;
    // Calculate bounds in the model's own coordinates, independent of placement in the room.
    scene.object3D.updateMatrixWorld(true);const inverse=fit.object3D.matrixWorld.clone().invert(),bounds=new THREE.Box3().makeEmpty(),part=new THREE.Box3(),matrix=new THREE.Matrix4();
    object.traverse(child=>{if(!child.isMesh||!child.geometry)return;child.geometry.computeBoundingBox();if(!child.geometry.boundingBox)return;matrix.multiplyMatrices(inverse,child.matrixWorld);part.copy(child.geometry.boundingBox).applyMatrix4(matrix);bounds.union(part)});
    if(bounds.isEmpty())return;const size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),longest=Math.max(size.x,size.y,size.z);if(!Number.isFinite(longest)||longest<=0)return;
    const factor=Math.min(10,1/longest)*scaleFactor;fittedFactor=factor;modelCenter.copy(center);
    // Hotspots and mesh are siblings in the same GLB coordinate system.
    fit.object3D.scale.setScalar(factor);fit.object3D.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor);
  }
  function updateScale(multiplier){scaleFactor=Math.min(8,Math.max(.1,scaleFactor*multiplier));if(modelReady)fitModel()}
  function animatePose(targetPosition,targetRotation,object){const token=++viewAnimation,start=performance.now(),fromPosition=object.position.clone(),fromRotation=object.quaternion.clone();
    function frame(now){if(token!==viewAnimation)return;const t=Math.min(1,(now-start)/650),ease=1-Math.pow(1-t,3);object.position.lerpVectors(fromPosition,targetPosition,ease);object.quaternion.copy(fromRotation).slerp(targetRotation,ease);if(t<1)requestAnimationFrame(frame)}requestAnimationFrame(frame);
  }
  function applyBookmark(saved){if(!saved||!modelReady)return;
    if(scene.is('ar-mode')){const targetRotation=new THREE.Quaternion().setFromEuler(new THREE.Euler(arBaseRotation.x-saved.pitch,arBaseRotation.y-saved.yaw,arBaseRotation.z,'YXZ'));animatePose(placement.object3D.position.clone(),targetRotation,placement.object3D);say('Enquadramento do hotspot: modelo girado para mostrar o detalhe.');return}
    // The Creator saves an orbit around the GLB in its original units.
    const target=fit.object3D.localToWorld(modelCenter.clone()),direction=new THREE.Vector3(Math.sin(saved.yaw)*Math.cos(saved.pitch),Math.sin(saved.pitch),Math.cos(saved.yaw)*Math.cos(saved.pitch));
    const destination=target.clone().addScaledVector(direction,Math.max(.1,saved.distance*fittedFactor));const look=new THREE.Camera();look.position.copy(destination);look.lookAt(target);
    placement.object3D.rotation.set(0,0,0);animatePose(destination,look.quaternion,camera.object3D);say('Enquadramento memorizado aplicado.');
  }
  function beginLoad(label){const number=++loadNumber;clear();if(fileUrl)URL.revokeObjectURL(fileUrl);fileUrl=null;progress(0,`Carregando ${label}`);say(`Carregando ${label}…`);return number}
  function displayBuffer(buffer,number){if(number!==loadNumber)return;const hotspots=readHotspots(buffer);fileUrl=URL.createObjectURL(new Blob([buffer],{type:'model/gltf-binary'}));buildMarkers(hotspots);progress(90,'Preparando geometria e texturas',true);model.setAttribute('gltf-model',`url(${fileUrl})`)}
  function readLocal(file,number){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onprogress=e=>{if(number===loadNumber&&e.lengthComputable)progress(e.loaded/e.total*85,'Lendo arquivo local')};reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||Error('Falha na leitura do arquivo.'));reader.readAsArrayBuffer(file)})}
  async function loadFile(file){if(!file)return;const number=beginLoad(file.name);try{displayBuffer(await readLocal(file,number),number)}catch(error){if(number===loadNumber)loadingError('Não foi possível abrir: '+error.message)}}
  async function loadRemote(address){let url;try{url=new URL(address,location.href);if(!['http:','https:'].includes(url.protocol))throw Error('Use um endereço HTTP ou HTTPS.')}catch(error){loadingError('Endereço inválido: '+error.message);return}
    const number=beginLoad(url.pathname.split('/').pop()||'GLB');try{const response=await fetch(url.href,{mode:'cors'});if(!response.ok)throw Error(`Servidor respondeu ${response.status}.`);
      const total=Number(response.headers.get('Content-Length'))||0;let buffer;
      if(response.body){const reader=response.body.getReader(),chunks=[];let received=0;for(;;){const {done,value}=await reader.read();if(done)break;if(number!==loadNumber){reader.cancel();return}chunks.push(value);received+=value.length;progress(total?Math.min(85,received/total*85):0,'Baixando GLB',!total)}buffer=new Uint8Array(received);let offset=0;for(const chunk of chunks){buffer.set(chunk,offset);offset+=chunk.length}buffer=buffer.buffer}
      else{progress(0,'Baixando GLB',true);buffer=await response.arrayBuffer()}
      displayBuffer(buffer,number);
    }catch(error){if(number===loadNumber)loadingError(error instanceof TypeError?'Não foi possível acessar essa URL. Verifique o endereço e a permissão CORS do servidor.':'Não foi possível carregar: '+error.message)}}
  $('#file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value=''});
  $('#url-toggle').addEventListener('click',()=>{const form=$('#url-form');form.hidden=!form.hidden;if(!form.hidden)$('#url-input').focus()});
  $('#url-form').addEventListener('submit',e=>{e.preventDefault();loadRemote($('#url-input').value.trim())});
  model.addEventListener('model-loaded',()=>{modelReady=true;scaleFactor=1;placement.object3D.position.set(0,1.3,-.8);placement.object3D.rotation.set(0,0,0);fitModel();camera.object3D.position.set(0,1.6,1);camera.object3D.rotation.set(0,0,0);$('#ar').disabled=!arSupported;progress(100,'Modelo pronto');const number=loadNumber;setTimeout(()=>{if(number===loadNumber)$('#loading').hidden=true},650);say(`${markers.length} hotspot(s). Arraste para girar; abra no celular para entrar em AR.`)});
  model.addEventListener('model-error',()=>{modelReady=false;$('#ar').disabled=true;loadingError('Falha ao carregar a malha ou as texturas deste GLB.')});
  card.addEventListener('click',closeCard);
  $('#toggle-pins').addEventListener('click',()=>{pinsVisible=!pinsVisible;$('#toggle-pins').textContent=pinsVisible?'Ocultar informações':'Mostrar informações';if(!pinsVisible){for(const item of markers)item.button.hidden=true;closeCard()}say(pinsVisible?'Pontos de informação visíveis.':'Pontos de informação ocultos.')});
  $('#smaller').addEventListener('click',()=>updateScale(.8));$('#larger').addEventListener('click',()=>updateScale(1.25));
  $('#center').addEventListener('click',()=>{if(!modelReady)return;++viewAnimation;scaleFactor=1;placement.object3D.rotation.copy(scene.is('ar-mode')?arBaseRotation:new THREE.Euler());if(!scene.is('ar-mode')){placement.object3D.position.set(0,1.3,-.8);camera.object3D.position.set(0,1.6,1);camera.object3D.rotation.set(0,0,0)}fitModel();closeCard();say(scene.is('ar-mode')?'Escala e rotação restauradas.':'Modelo centralizado na visualização 3D.')});
  $('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else say('Tela cheia indisponível neste navegador.')}catch(error){say('Não foi possível abrir a tela cheia: '+error.message)}});
  $('#return-menu').addEventListener('click',async()=>{if(document.fullscreenElement)await document.exitFullscreen()});
  document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fullscreen-ui',!!document.fullscreenElement);$('#fullscreen').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia'});
  $('#bg-color').addEventListener('input',e=>{bgColor=e.target.value;scene.style.backgroundColor=bgColor;bgImage=null;if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=null;scene.style.backgroundImage='none';say('Cor de fundo aplicada.')});
  $('#bg-file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=url;bgImage=image;scene.style.backgroundImage=`url("${url}")`;say('Imagem de fundo aplicada.')};image.onerror=()=>{URL.revokeObjectURL(url);say('Não foi possível abrir essa imagem.')};image.src=url;e.target.value=''});
  $('#clear-bg').addEventListener('click',()=>{if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=null;bgImage=null;bgColor='#182238';$('#bg-color').value=bgColor;scene.style.backgroundImage='none';scene.style.backgroundColor=bgColor;say('Fundo padrão restaurado.')});
  function drawTextLines(ctx,value,x,y,maxWidth,lineHeight,maxY){const paragraphs=String(value||'').split('\n');for(const paragraph of paragraphs){let line='';for(const word of paragraph.split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width>maxWidth&&line){if(y+lineHeight>maxY)return y;ctx.fillText(line,x,y);y+=lineHeight;line=word}else line=next}if(y+lineHeight>maxY)return y;ctx.fillText(line,x,y);y+=lineHeight}return y}
  $('#export-jpg').addEventListener('click',()=>{if(!modelReady){say('Abra um GLB antes de exportar.');return}if(scene.is('ar-mode')){say('Saia da AR para exportar a vista com o fundo escolhido.');return}
    try{const width=innerWidth,height=innerHeight,ratio=Math.min(devicePixelRatio||1,2),output=document.createElement('canvas');output.width=Math.round(width*ratio);output.height=Math.round(height*ratio);const ctx=output.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle=bgColor;ctx.fillRect(0,0,width,height);
      if(bgImage){const factor=Math.max(width/bgImage.width,height/bgImage.height),w=bgImage.width*factor,h=bgImage.height*factor;ctx.drawImage(bgImage,(width-w)/2,(height-h)/2,w,h)}
      scene.object3D.updateMatrixWorld(true);scene.renderer.render(scene.object3D,scene.camera);ctx.drawImage(scene.renderer.domElement,0,0,width,height);
      if(active&&!card.hidden&&$('#connector').style.visibility==='visible'){const line=$('#connector-line');ctx.beginPath();ctx.moveTo(Number(line.getAttribute('x1')),Number(line.getAttribute('y1')));ctx.lineTo(Number(line.getAttribute('x2')),Number(line.getAttribute('y2')));ctx.strokeStyle='#ffbc4a';ctx.lineWidth=2;ctx.stroke()}
      for(const item of markers){if(item.button.hidden)continue;const radius=Math.max(5,item.data.size/2),x=item.x,y=item.y;ctx.beginPath();ctx.arc(x,y,radius+3,0,Math.PI*2);ctx.fillStyle='#ffbb3666';ctx.fill();ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fillStyle='#ffbb36';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()}
      if(active&&!card.hidden){const box=card.getBoundingClientRect(),x=box.left,y=box.top,w=box.width,h=box.height;ctx.fillStyle='#192437';ctx.strokeStyle='#75839a';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();ctx.stroke();ctx.fillStyle='#f5f7ff';ctx.font='bold 17px system-ui';let line=drawTextLines(ctx,active.data.title,x+16,y+34,w-38,22,y+h-30);ctx.font='15px system-ui';drawTextLines(ctx,active.data.text,x+16,line+9,w-32,21,y+h-8)}
      output.toBlob(blob=>{if(!blob){say('Não foi possível gerar o JPG.');return}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='glb_viewer_'+new Date().toISOString().slice(0,10)+'.jpg';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);say('JPG exportado.')},'image/jpeg',.92);
    }catch(error){say('Falha ao exportar JPG: '+error.message)}
  });
  async function checkAR(){if(!navigator.xr||!isSecureContext){say('Abra por HTTPS para usar AR. A visualização 3D continua disponível.');return}try{arSupported=await navigator.xr.isSessionSupported('immersive-ar');$('#ar').disabled=!arSupported||!modelReady;if(!arSupported)say('AR indisponível neste navegador. Você ainda pode visualizar o GLB em 3D.')}catch{say('Não foi possível verificar o suporte à AR.')}}
  scene.addEventListener('loaded',checkAR);
  $('#ar').addEventListener('click',async()=>{if(!modelReady)return;try{await scene.enterAR()}catch(error){say('Não foi possível iniciar a AR: '+error.message)}});
  scene.addEventListener('enter-ar',()=>{placed=false;placement.object3D.visible=false;scene.setAttribute('ar-hit-test','enabled',true);$('#replace').hidden=false;closeCard();say('Aponte para uma superfície e toque para colocar o modelo.')});
  scene.addEventListener('ar-hit-test-achieved',()=>say('Superfície encontrada. Toque para posicionar o modelo.'));
  scene.addEventListener('ar-hit-test-select',()=>{placed=true;placement.object3D.visible=true;arBaseRotation.copy(placement.object3D.rotation);scene.setAttribute('ar-hit-test','enabled',false);say('Modelo posicionado. Toque em um ponto amarelo para abrir a informação.')});
  scene.addEventListener('exit-ar',()=>{scene.setAttribute('ar-hit-test','enabled',false);placement.object3D.visible=true;placed=false;$('#replace').hidden=true;placement.object3D.position.set(0,1.3,-.8);say('Visualização 3D. Arraste para girar o modelo.')});
  $('#replace').addEventListener('click',()=>{placed=false;placement.object3D.visible=false;closeCard();scene.setAttribute('ar-hit-test','enabled',true);say('Aponte para outra superfície e toque para reposicionar.')});
  // Preview mouse/touch orbit; XR tracking always controls the camera in AR.
  scene.addEventListener('renderstart',()=>{const surface=scene.canvas||scene.renderer.domElement;surface.style.touchAction='none';
    surface.addEventListener('pointerdown',e=>{if(scene.is('ar-mode')||!modelReady)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};surface.setPointerCapture(e.pointerId);e.preventDefault()});
    surface.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||scene.is('ar-mode'))return;placement.object3D.rotation.y+=(e.clientX-drag.x)*.008;placement.object3D.rotation.x=Math.max(-1.2,Math.min(1.2,placement.object3D.rotation.x+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY;e.preventDefault()});
    const stop=e=>{if(drag?.id===e.pointerId)drag=null};surface.addEventListener('pointerup',stop);surface.addEventListener('pointercancel',stop);
    surface.addEventListener('wheel',e=>{if(scene.is('ar-mode'))return;e.preventDefault();updateScale(e.deltaY<0?1.08:.92)},{passive:false});
  });
  const vector=new THREE.Vector3();function drawPins(){requestAnimationFrame(drawPins);if(!modelReady||!scene.camera||!scene.renderer)return;const ar=scene.is('ar-mode');if(ar&&!placed){for(const item of markers)item.button.hidden=true;$('#connector').style.visibility='hidden';return}
      const renderCamera=ar?scene.renderer.xr.getCamera(scene.camera):scene.camera,modelRect=active&&!card.hidden?modelScreenRect(renderCamera):null;
      for(const item of markers){item.anchor.object3D.getWorldPosition(vector);vector.project(renderCamera);const visible=vector.z>=-1&&vector.z<=1&&Math.abs(vector.x)<1.15&&Math.abs(vector.y)<1.15;item.button.hidden=!pinsVisible||!visible;if(!visible){if(active===item)$('#connector').style.visibility='hidden';continue}
        item.x=(vector.x*.5+.5)*innerWidth;item.y=(-vector.y*.5+.5)*innerHeight;item.button.style.left=item.x+'px';item.button.style.top=item.y+'px';if(active===item&&!card.hidden)positionCard(item.x,item.y,modelRect);
      }
    }requestAnimationFrame(drawPins);
  const requested=new URL(location.href).searchParams.get('modelo');if(requested)loadRemote(requested);
})();
</script>

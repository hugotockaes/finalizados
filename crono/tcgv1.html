let drag=null,origin=null;
let activeUC='UC1';
const lessons=document.getElementById('lessons');
function itemInfo(id){
 for(const [uc,d] of Object.entries(UCS))for(const [g,items] of d.groups)for(const [i,t] of items)if(i===id)return {uc,group:g,text:t};
 return null;
}
function renderUC(){
 const uc=activeUC,d=UCS[uc];
 document.getElementById('ucTitle').textContent=uc+' — '+d.title;
 document.getElementById('ucHours').textContent='Carga horária: '+d.hours+' horas • Planejador de aulas';
 const used=new Set([...document.querySelectorAll('.placed')].map(x=>x.dataset.id));
 const box=document.getElementById('knowledgeBox');box.innerHTML='';
 if(!d.groups.length){box.innerHTML='<div style="padding:18px;border:1px dashed #bcc4d6;border-radius:10px;color:#687089"><b>Projeto Integrador</b><br>Esta UC é de natureza diferenciada e o Plano de Curso não apresenta uma lista própria de “Conhecimentos”. Ela articula as competências das demais UCs da qualificação.</div>';}
 d.groups.forEach(([name,items])=>{
  const g=document.createElement('div');g.className='grp';g.innerHTML=`<h3>${name}</h3><div class="chips"></div>`;
  const chips=g.querySelector('.chips');
  items.forEach(([id,text])=>{if(!used.has(id))chips.appendChild(makeBankChip(id,text))});
  box.appendChild(g);
 });
 update();
}
function makeBankChip(id,text){
 const c=document.createElement('div');c.className='chip';c.draggable=true;c.dataset.id=id;c.textContent=text;
 c.ondragstart=e=>{drag={id,text};origin=c;e.dataTransfer.effectAllowed='move'};return c;
}
function put(z,id,text){
 const x=document.createElement('div');x.className='placed '+(itemInfo(id)?.uc||'').toLowerCase();x.dataset.id=id;x.draggable=true;
 x.innerHTML=`<span>${text}</span><button title="Remover">×</button>`;
 x.querySelector('button').onclick=()=>{x.remove();renderUC()};
 x.ondragstart=e=>{drag={id,text};origin=x;e.dataTransfer.effectAllowed='move'};z.appendChild(x)
}
function setup(z){
 z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
 z.ondrop=e=>{e.preventDefault();z.classList.remove('over');if(!drag)return;
  const info=itemInfo(drag.id), row=z.closest('.lesson');
  if(info && row.querySelector('.lesson-uc').value!==info.uc){alert('Este conhecimento pertence à '+info.uc+'. Altere a UC da aula antes de adicioná-lo.');return}
  if(origin)origin.remove();put(z,drag.id,drag.text);drag=null;origin=null;renderUC()
 }
}

let draggedLesson=null;
function enableLessonSorting(r){
 r.draggable=true;
 r.addEventListener('dragstart',e=>{
   // Do not reorder when the user is dragging a knowledge card or interacting with controls.
   if(e.target.closest('.placed') || ['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){
     e.preventDefault(); return;
   }
   draggedLesson=r;
   r.classList.add('dragging');
   e.dataTransfer.effectAllowed='move';
 });
 r.addEventListener('dragend',()=>{
   r.classList.remove('dragging');
   document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('drag-target'));
   draggedLesson=null;
   renumberLessons();
 });
 r.addEventListener('dragover',e=>{
   if(!draggedLesson || draggedLesson===r) return;
   e.preventDefault();
   r.classList.add('drag-target');
   const rect=r.getBoundingClientRect();
   const after=e.clientY > rect.top + rect.height/2;
   lessons.insertBefore(draggedLesson, after ? r.nextSibling : r);
 });
 r.addEventListener('dragleave',()=>r.classList.remove('drag-target'));
 r.addEventListener('drop',e=>{
   if(!draggedLesson)return;
   e.preventDefault();
   r.classList.remove('drag-target');
   renumberLessons();
 });
}

function renumberLessons(){[...lessons.children].forEach((r,i)=>r.querySelector('.lesson-number').textContent='Aula '+(i+1))}

  const newUC=e.target.value, bad=[...r.querySelectorAll('.placed')].some(x=>itemInfo(x.dataset.id)?.uc!==newUC);

 };

function analyzeHours(){
 const answer=prompt('Quantas horas possui cada dia de aula?\\n\\nExemplo: 4');
 if(answer===null)return;
 const hoursPerDay=Number(String(answer).replace(',','.'));
 if(!Number.isFinite(hoursPerDay)||hoursPerDay<=0){
   alert('Digite uma quantidade de horas válida.');
   return;
 }

 const rows=[...document.querySelectorAll('.lesson')];
 const counts={};
 rows.forEach(r=>{
   const uc=r.querySelector('.lesson-uc')?.value;
   if(uc)counts[uc]=(counts[uc]||0)+1;
 });

 const order=Object.keys(UCS).sort((a,b)=>parseInt(a.slice(2))-parseInt(b.slice(2)));
 const stats=order.map(uc=>{
   const planned=counts[uc]||0;
   const given=planned*hoursPerDay;
   const total=Number(UCS[uc].hours)||0;
   const remaining=Math.max(total-given,0);
   const pct=total>0?Math.min((given/total)*100,100):0;
   return {uc,title:UCS[uc].title,total,planned,given,remaining,pct};
 });

 const win=window.open('','_blank','width=1000,height=760,scrollbars=yes,resizable=yes');
 if(!win){
   alert('O navegador bloqueou a janela de análise. Permita pop-ups para este arquivo e tente novamente.');
   return;
 }
 const rowsHtml=stats.map(x=>`
   <tr>

    <td class="num">${x.given.toLocaleString('pt-BR',{maximumFractionDigits:2})} h</td>
    <td class="num">${x.total} h</td>
    <td class="num">${x.remaining.toLocaleString('pt-BR',{maximumFractionDigits:2})} h</td>
    <td><div class="bar"><span style="width:${x.pct}%"></span></div><small>${x.pct.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</small></td>
   </tr>`).join('');

 .bar span{display:block;height:100%;background:#4567d9;border-radius:10px}
 small{color:#697386}
 </style></head><body>
 <header><h1 style="margin:0 0 6px">Análise do Planejamento</h1>
 <div>Considerando <b>${hoursPerDay.toLocaleString('pt-BR')} hora(s)</b> por dia de aula</div></header>
 <main>
 <div class="summary">
   <div class="card">Aulas planejadas<b>${totalLessons}</b></div>

   <div class="card">UCs com aulas<b>${Object.keys(counts).length}</b></div>
 </div>
 <table><thead><tr><th>UC</th><th>Unidade Curricular</th><th>Aulas</th><th>Horas planejadas</th><th>Carga da UC</th><th>Restante</th><th>Progresso</th></tr></thead>

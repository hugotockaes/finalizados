<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moodboard Creator</title><style>
:root{--bg:#eef1f4;--panel:#fff;--dark:#181b20;--gold:#d9a43a;--line:#d8dde3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#20242a;font:15px Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;box-shadow:0 3px 16px #0003}.top{max-width:1450px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.brand{margin-right:auto}.brand h1{font-size:19px;margin:0 0 3px}.brand small{color:#b8bec7}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.upload{border:0;border-radius:8px;cursor:pointer;background:#e8edf3;color:#222831;padding:10px 13px;font:700 13px Arial,sans-serif}button:hover,.upload:hover{filter:brightness(.92)}button:disabled{opacity:.5;cursor:default}.gold{background:var(--gold)}select,input[type=color]{border:1px solid #ced5df;border-radius:8px;padding:8px;background:#fff}main{max-width:1450px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.work{min-width:0}.canvas-area{min-height:70vh;background:#dce2e9;border:1px solid #cbd4de;border-radius:14px;display:grid;place-items:center;overflow:auto;padding:28px}.page{position:relative;background:white;flex:none;box-shadow:0 15px 45px #2634423e;overflow:hidden;touch-action:none}.page.portrait{width:min(100%,660px);aspect-ratio:210/297}.page.landscape{width:min(100%,900px);aspect-ratio:297/210}.element{position:absolute;touch-action:none;cursor:grab;transform-origin:center center;user-select:none}.element.selected{outline:2px solid #d9a43a;outline-offset:2px;z-index:10000!important}.element img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}.element.text{white-space:pre-wrap;overflow:hidden;font-weight:bold;line-height:1.2;padding:5px}.element.swatch{box-shadow:0 2px 7px #0002}.handle{position:absolute;width:14px;height:14px;border:2px solid white;background:#d9a43a;border-radius:50%;right:-7px;bottom:-7px;cursor:nwse-resize;touch-action:none}.rotate-handle{position:absolute;width:15px;height:15px;border:2px solid white;background:#4387b9;border-radius:50%;left:calc(50% - 7px);top:-29px;cursor:grab;touch-action:none}.rotate-handle::after{content:'';position:absolute;left:5px;top:13px;width:2px;height:12px;background:#4387b9}.side{background:#fff;border-radius:14px;padding:17px;border:1px solid #e0e5ea;align-self:start}.side h2{font-size:15px;margin:0 0 13px}.side label{display:block;font-size:11px;text-transform:uppercase;font-weight:bold;letter-spacing:.6px;color:#6b7480;margin:13px 0 6px}.side input[type=range]{width:100%;accent-color:var(--gold)}.side input[type=color],.side input[type=text],.side textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px}.side textarea{resize:vertical;min-height:70px}.side .row{display:flex;gap:7px;flex-wrap:wrap}.side .row button{flex:1}.side hr{border:0;border-top:1px solid var(--line);margin:17px 0}.status{font-size:12px;color:#826629;min-height:1.2em;margin:12px 0}.hint{font-size:12px;color:#717a85;line-height:1.5}input[type=file]{display:none}@media(max-width:950px){main{grid-template-columns:1fr}.side{order:-1}.canvas-area{padding:13px;min-height:50vh}}@media print{header,.side,.status,.hint{display:none!important}body,main,.work,.canvas-area{margin:0;padding:0;background:white;border:0;display:block;max-width:none;min-height:0;overflow:visible}.page{width:100%!important;height:100%!important;box-shadow:none;aspect-ratio:auto}.element.selected{outline:0}.handle,.rotate-handle{display:none}@page{size:A4 portrait;margin:0}}
</style></head><body><header><div class="top"><div class="brand"><h1>Moodboard Creator</h1><small>Componha suas referências em uma página A4</small></div><div class="actions"><label class="upload" for="images">+ Carregar imagens</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple><button id="add-text">+ Texto</button><button id="add-color">+ Cor</button><select id="orientation" aria-label="Orientação A4"><option value="portrait">A4 vertical</option><option value="landscape">A4 horizontal</option></select><button id="save">Salvar projeto</button><button id="load">Abrir projeto</button><input id="project-file" type="file" accept=".json,application/json"><button id="png" class="gold">Exportar PNG</button><button id="print">Imprimir A4</button></div></div></header><main><div class="work"><div class="canvas-area"><div id="page" class="page portrait" aria-label="Página do moodboard"></div></div><p class="hint">Arraste os elementos pela página. Use o círculo amarelo para redimensionar e o azul para girar. Clique fora para remover a seleção.</p><p id="status" class="status" role="status"></p></div><aside class="side"><h2>Propriedades</h2><label for="background">Fundo da página</label><input id="background" type="color" value="#ffffff"><hr><div id="properties"><p class="hint">Selecione uma imagem, texto ou cor para editar.</p></div></aside></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),page=$('#page'),state={items:[],selected:null,nextZ:1,orientation:'portrait',background:'#ffffff'};function id(){return Math.random().toString(36).slice(2)}function selected(){return state.items.find(x=>x.id===state.selected)}function setStatus(s){$('#status').textContent=s}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function style(el,item){el.style.left=item.x+'%';el.style.top=item.y+'%';el.style.width=item.w+'%';el.style.height=item.h+'%';el.style.transform=`rotate(${item.rotation}deg)`;el.style.zIndex=item.z;el.classList.toggle('selected',item.id===state.selected);if(item.type==='text'){el.style.color=item.color;el.style.fontSize=`${page.clientWidth*item.font/100}px`;el.style.backgroundColor=item.fill||'transparent'}if(item.type==='swatch')el.style.backgroundColor=item.color}
function draw(){page.style.backgroundColor=state.background;page.className='page '+state.orientation;page.replaceChildren();for(let item of state.items){let el=document.createElement('div');el.className='element '+item.type;el.dataset.id=item.id;if(item.type==='image'){let img=document.createElement('img');img.src=item.src;img.alt='Imagem do moodboard';el.append(img)}else if(item.type==='text')el.textContent=item.text;style(el,item);if(item.id===state.selected){let resize=document.createElement('span');resize.className='handle';resize.title='Redimensionar';let rotate=document.createElement('span');rotate.className='rotate-handle';rotate.title='Girar';el.append(resize,rotate)}el.addEventListener('pointerdown',pointerDown);page.append(el)}properties()}
function add(item){state.items.push({id:id(),x:10,y:10,w:35,h:30,rotation:0,z:state.nextZ++,...item});state.selected=state.items.at(-1).id;draw()}function point(ev){let r=page.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100}}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function pointerDown(ev){if(ev.button!==0)return;ev.preventDefault();let el=ev.currentTarget,item=state.items.find(x=>x.id===el.dataset.id);if(!item)return;let mode=ev.target.classList.contains('handle')?'resize':ev.target.classList.contains('rotate-handle')?'rotate':'move';state.selected=item.id;draw();el=page.querySelector(`[data-id="${item.id}"]`);let start=point(ev),original={...item},center={x:item.x+item.w/2,y:item.y+item.h/2};const move=e=>{let p=point(e);if(mode==='move'){item.x=clamp(original.x+p.x-start.x,-item.w+2,98);item.y=clamp(original.y+p.y-start.y,-item.h+2,98)}else if(mode==='resize'){item.w=clamp(original.w+p.x-start.x,3,120);item.h=clamp(original.h+p.y-start.y,3,120)}else item.rotation=Math.round(Math.atan2(p.y-center.y,p.x-center.x)*180/Math.PI+90);style(el,item);properties()};const done=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',done);window.addEventListener('pointercancel',done)}page.addEventListener('pointerdown',e=>{if(e.target===page){state.selected=null;draw()}});
function properties(){let box=$('#properties'),it=selected();if(!it){box.innerHTML='<p class="hint">Selecione uma imagem, texto ou cor para editar.</p>';return}box.replaceChildren();const field=(name,value,callback,type='text')=>{let label=document.createElement('label');label.textContent=name;let input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=value;input.addEventListener('input',e=>{callback(e.target.value);if(type==='color')draw();else{let el=page.querySelector(`[data-id="${it.id}"]`);if(type==='textarea')el.childNodes[0].textContent=it.text;style(el,it)}});box.append(label,input);return input};if(it.type==='text'){field('Texto',it.text,v=>it.text=v,'textarea');field('Cor do texto',it.color,v=>it.color=v,'color');let input=field('Tamanho do texto',it.font,v=>{it.font=+v;page.querySelector(`[data-id="${it.id}"]`).style.fontSize=(page.clientWidth*v/100)+'px'},'range');input.min=1;input.max=12;input.step=.2}else if(it.type==='swatch')field('Cor',it.color,v=>it.color=v,'color');else{let label=document.createElement('p');label.className='hint';label.textContent='Imagem selecionada';box.append(label)}let actions=document.createElement('div');actions.className='row';for(let [title,fn] of [['Para frente',()=>{it.z=state.nextZ++;draw()}],['Para trás',()=>{it.z=Math.min(...state.items.map(x=>x.z))-1;draw()}],['Duplicar',()=>add({...it,id:id(),x:it.x+3,y:it.y+3,z:state.nextZ++})],['Excluir',()=>{state.items=state.items.filter(x=>x.id!==it.id);state.selected=null;draw()}]]){let b=document.createElement('button');b.textContent=title;b.onclick=fn;actions.append(b)}box.append(actions)}
$('#images').onchange=async e=>{let files=[...e.target.files];for(let file of files){try{let src=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});let image=new Image();image.src=src;await image.decode();let ratio=image.width/image.height,w=35,h=state.orientation==='portrait'?w*210/297/ratio:w*297/210/ratio;add({type:'image',src,w,h:clamp(h,8,80),x:10+Math.random()*12,y:10+Math.random()*12})}catch{setStatus('Uma imagem não pôde ser carregada.')}}e.target.value='';setStatus(`${files.length} imagem(ns) carregada(s).`)};$('#add-text').onclick=()=>add({type:'text',text:'Nova ideia',color:'#20242a',fill:'transparent',font:4,w:40,h:12});$('#add-color').onclick=()=>add({type:'swatch',color:'#d9a43a',w:18,h:15});$('#background').oninput=e=>{state.background=e.target.value;page.style.backgroundColor=state.background};$('#orientation').onchange=e=>{state.orientation=e.target.value;draw()};
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}function dimensions(){return state.orientation==='portrait'?[2480,3508]:[3508,2480]}function wrap(ctx,text,x,y,maxWidth,lineHeight){for(let paragraph of text.split('\n')){let line='';for(let word of paragraph.split(/\s+/)){let trial=line?line+' '+word:word;if(ctx.measureText(trial).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=word}else line=trial}ctx.fillText(line,x,y);y+=lineHeight}return y}
async function exportCanvas(){let [W,H]=dimensions(),canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;let c=canvas.getContext('2d');c.fillStyle=state.background;c.fillRect(0,0,W,H);for(let it of [...state.items].sort((a,b)=>a.z-b.z)){let x=it.x/100*W,y=it.y/100*H,w=it.w/100*W,h=it.h/100*H;c.save();c.translate(x+w/2,y+h/2);c.rotate(it.rotation*Math.PI/180);if(it.type==='image'){let img=new Image();img.src=it.src;await img.decode();let scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale;c.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,-w/2,-h/2,w,h)}else if(it.type==='swatch'){c.fillStyle=it.color;c.fillRect(-w/2,-h/2,w,h)}else{if(it.fill&&it.fill!=='transparent'){c.fillStyle=it.fill;c.fillRect(-w/2,-h/2,w,h)}c.beginPath();c.rect(-w/2,-h/2,w,h);c.clip();c.fillStyle=it.color;c.font=`bold ${Math.max(8,it.font/100*W)}px Arial`;c.textBaseline='top';wrap(c,it.text,-w/2+10,-h/2+10,w-20,it.font/100*W*1.2)}c.restore()}return canvas}
$('#png').onclick=async()=>{let b=$('#png');b.disabled=true;setStatus('Preparando imagem A4 em alta resolução…');try{let canvas=await exportCanvas(),blob=await new Promise((resolve,reject)=>canvas.toBlob(x=>x?resolve(x):reject(Error('Falha no PNG')),'image/png'));download(blob,`moodboard_A4_${state.orientation==='portrait'?'vertical':'horizontal'}.png`);setStatus(`PNG exportado: ${canvas.width} × ${canvas.height} px.`)}catch(err){setStatus('Falha na exportação: '+err.message)}finally{b.disabled=false}};
$('#print').onclick=()=>{let style=$('#print-orientation')||document.createElement('style');style.id='print-orientation';style.textContent=`@media print{@page{size:A4 ${state.orientation};margin:0}}`;document.head.append(style);window.print()};$('#save').onclick=()=>{let data={format:'moodboard-creator',version:1,orientation:state.orientation,background:state.background,items:state.items};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'moodboard_projeto.json');setStatus('Projeto salvo. O arquivo inclui as imagens.')};$('#load').onclick=()=>$('#project-file').click();$('#project-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.format!=='moodboard-creator'||!Array.isArray(data.items)||data.items.length>500)throw Error('Projeto inválido');state.orientation=data.orientation==='landscape'?'landscape':'portrait';state.background=/^#[0-9a-f]{6}$/i.test(data.background)?data.background:'#ffffff';state.items=data.items.filter(x=>['image','text','swatch'].includes(x.type)).map(x=>({...x,id:id(),x:Number(x.x)||0,y:Number(x.y)||0,w:Number(x.w)||20,h:Number(x.h)||20,rotation:Number(x.rotation)||0,z:Number(x.z)||0}));state.nextZ=Math.max(1,...state.items.map(x=>x.z+1));state.selected=null;$('#orientation').value=state.orientation;$('#background').value=state.background;draw();setStatus('Projeto carregado.')}catch(err){setStatus('Falha ao abrir: '+err.message)}e.target.value=''};window.addEventListener('resize',()=>{for(let it of state.items)if(it.type==='text'){let el=page.querySelector(`[data-id="${it.id}"]`);if(el)el.style.fontSize=page.clientWidth*it.font/100+'px'}});draw()})();
</script></body></html>
